[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-world"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "fastapi==0.115.12", "pydantic==2.11.4", "uvicorn[standard]==0.34.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "httpx==0.28.1", "ruff==0.11.8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
